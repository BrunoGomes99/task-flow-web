# CI override for task-flow-api. Pass it explicitly so Compose does not load
# docker-compose.override.yml, which mounts Windows User Secrets:
#   docker compose -f docker-compose.yml -f ci/docker-compose.ci.yml up -d taskflow.api
# Keys match Jwt in task-flow-api appsettings.json (Jwt__* is the env form of Jwt:*).
# The secret is a test-only value of at least 32 UTF-8 bytes. Development matches the
# local override: outside Development the API enables HTTPS redirection.
services:
  taskflow.api:
    ports:
      - '8080:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: 'TaskFlow_CI_TestOnly_Key_NotForProduction_32B!'
      Jwt__Issuer: TaskFlow
      Jwt__Audience: TaskFlow.Api
      Jwt__AccessTokenLifetimeSeconds: '3600'
