<button
  type="button"
  class="inline-flex items-center gap-2 rounded-xl border border-border bg-surface px-3 py-2 text-sm font-semibold md:hidden"
  [attr.aria-expanded]="filtersOpen()"
  [attr.aria-controls]="panelId"
  (click)="toggleFilters()"
>
  <svg lucideSlidersHorizontal class="size-4 text-accent-text" aria-hidden="true" />
  Filtros
</button>

<div [id]="panelId" [class]="panelClass()">
  <div class="relative min-w-0 flex-1 md:max-w-xs">
    <input
      type="text"
      class="w-full rounded-xl border border-border bg-background py-2 pr-10 pl-3 text-sm text-text placeholder:text-secondary-text/60"
      aria-label="Filtrar por título"
      placeholder="Filtrar por título"
      autocomplete="off"
      [value]="titleText()"
      (input)="onTitleInput($event)"
    />
    @if (titleText().length > 0) {
      <button
        type="button"
        class="absolute top-1/2 right-1 inline-flex size-8 -translate-y-1/2 items-center justify-center rounded-lg text-secondary-text"
        aria-label="Limpar filtro de título"
        (click)="clearTitle()"
      >
        <svg lucideX class="size-4" aria-hidden="true" />
      </button>
    }
  </div>

  <div class="relative min-w-0 flex-1 md:max-w-xs">
    <input
      type="text"
      class="w-full rounded-xl border border-border bg-background py-2 pr-10 pl-3 text-sm text-text placeholder:text-secondary-text/60"
      aria-label="Filtrar por descrição"
      placeholder="Filtrar por descrição"
      autocomplete="off"
      [value]="descriptionText()"
      (input)="onDescriptionInput($event)"
    />
    @if (descriptionText().length > 0) {
      <button
        type="button"
        class="absolute top-1/2 right-1 inline-flex size-8 -translate-y-1/2 items-center justify-center rounded-lg text-secondary-text"
        aria-label="Limpar filtro de descrição"
        (click)="clearDescription()"
      >
        <svg lucideX class="size-4" aria-hidden="true" />
      </button>
    }
  </div>

  <app-multi-select
    label="Colunas visíveis"
    [options]="statusOptions"
    [selected]="viewFilters().statuses"
    (selectedChange)="onStatusesChange($event)"
  />

  <select
    class="w-full rounded-xl border border-border bg-surface px-3 py-2 text-sm font-semibold md:w-auto"
    aria-label="Ordenar por vencimento"
    [value]="viewFilters().order"
    (change)="onOrderChange($event)"
  >
    <option value="asc">Vencimento: Crescente</option>
    <option value="desc">Vencimento: Decrescente</option>
  </select>
</div>
