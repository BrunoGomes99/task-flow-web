<button
  type="button"
  tabindex="-1"
  class="fixed inset-0 z-30 col-start-1 row-start-1 bg-text/40 transition-opacity duration-200 ease-out motion-reduce:transition-none lg:hidden"
  [class.opacity-0]="!sidebarOpen()"
  [class.pointer-events-none]="!sidebarOpen()"
  [attr.aria-hidden]="sidebarOpen() ? null : 'true'"
  aria-label="Fechar menu"
  (click)="closeSidebar()"
></button>

<div
  id="app-sidebar"
  class="drawer col-start-1 row-start-1 h-full max-lg:fixed max-lg:inset-y-0 max-lg:left-0 max-lg:z-40 max-lg:h-dvh max-lg:w-64 max-lg:overflow-y-auto max-lg:shadow-xl"
  [attr.data-open]="sidebarOpen() ? '' : null"
  [cdkTrapFocus]="sidebarOpen()"
  [cdkTrapFocusAutoCapture]="sidebarOpen()"
  [attr.role]="sidebarOpen() ? 'dialog' : null"
  [attr.aria-modal]="sidebarOpen() ? 'true' : null"
  [attr.aria-label]="sidebarOpen() ? 'Barra lateral' : null"
>
  <app-sidebar />
</div>

<div
  class="col-start-1 row-start-1 flex min-w-0 flex-col lg:col-start-2"
  [attr.inert]="sidebarOpen() ? '' : null"
>
  <app-header>
    <button
      #menuButton
      type="button"
      class="inline-flex size-10 shrink-0 items-center justify-center rounded-lg border border-border bg-surface text-accent-text hover:bg-background lg:hidden"
      aria-label="Abrir menu"
      aria-controls="app-sidebar"
      [attr.aria-expanded]="sidebarOpen()"
      (click)="toggleSidebar()"
    >
      <svg lucideMenu class="size-5" aria-hidden="true" />
    </button>
  </app-header>
  <main class="flex-1 p-4 md:px-6">
    <router-outlet />
  </main>
</div>
