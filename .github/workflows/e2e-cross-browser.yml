name: E2E cross-browser

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (Firefox and WebKit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Read API ref
        id: api-ref
        run: |
          sha=$(tr -d '[:space:]' < api-contract/API_REF)
          if [ -z "$sha" ]; then
            echo "api-contract/API_REF is empty"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout task-flow-api
        uses: actions/checkout@v4
        with:
          repository: BrunoGomes99/task-flow-api
          ref: ${{ steps.api-ref.outputs.sha }}
          path: task-flow-api
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Start API
        working-directory: task-flow-api
        run: |
          # mongo:8.0.30 exits on GitHub-hosted runners: Ubuntu reports the kernel
          # as 7.0.0, and that release refuses kernels from 6.19 up (SERVER-121912).
          # glibc.pthread.rseq=1 is the upstream workaround and overrides the image default.
          printf '%s\n' \
            'services:' \
            '  mongo:' \
            '    environment:' \
            '      GLIBC_TUNABLES: glibc.pthread.rseq=1' \
            > /tmp/ci-mongo.yml
          compose=(docker compose -f docker-compose.yml -f /tmp/ci-mongo.yml)
          "${compose[@]}" up -d --build taskflow.api
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:8080/health/live >/dev/null; then
              echo "API is live"
              exit 0
            fi
            sleep 2
          done
          echo "GET http://localhost:8080/health/live did not succeed in time"
          "${compose[@]}" ps -a
          "${compose[@]}" logs mongo
          "${compose[@]}" logs taskflow.api
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps firefox webkit

      - name: E2E
        run: npx playwright test --project=firefox --project=webkit

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cross-browser
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
