name: CI

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check generated API types
        run: |
          npm run api:types
          git diff --exit-code

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Read API ref
        id: api-ref
        run: |
          sha=$(tr -d '[:space:]' < api-contract/API_REF)
          if [ -z "$sha" ]; then
            echo "api-contract/API_REF is empty"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout task-flow-api
        uses: actions/checkout@v4
        with:
          repository: BrunoGomes99/task-flow-api
          ref: ${{ steps.api-ref.outputs.sha }}
          path: task-flow-api
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Start API
        working-directory: task-flow-api
        run: |
          docker compose up -d --build taskflow.api
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:8080/health/live >/dev/null; then
              echo "API is live"
              exit 0
            fi
            sleep 2
          done
          echo "GET http://localhost:8080/health/live did not succeed in time"
          docker compose ps -a
          docker compose logs mongo
          docker compose logs taskflow.api
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
